[project]
name = "scutes"
description = "Item Processing Application for WHCA Pool Reports Collection"
version = "2.0.0-dev"
requires-python = ">=3.14"
license = {text = "Apache-2.0 license"}
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.06.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.8",
    "crispy-bootstrap5==2026.3",
    "cryptography==43.0.3",
    "defusedxml==0.7.1",
    "Django==5.2.15",
    "django-auto-logout==0.5.1",
    "django-bootstrap5==26.2",
    "django-crispy-forms==2.6",
    "django-debug-toolbar==7.0.0",
    "django-environ==0.13.0",
    "django-filter==25.2",
    "django-htmx==1.27.0",
    "django-umd-lib-style @ git+https://github.com/umd-lib/django-umd-lib-style.git@main",
    "djangosaml2==1.12.0",
    "elementpath==4.8.0",
    "emoji==2.15.0",
    "exceptiongroup==1.3.1",
    "h11==0.16.0",
    "html-sanitizer==2.6",
    "idna==3.18",
    "iniconfig==2.3.0",
    "lxml==6.1.1",
    "mailbox==0.4",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "outcome==1.3.0",
    "packaging==26.2",
    "pandas==2.3.3",
    "phonenumbers==9.0.34",
    "Pillow==12.3.0",
    "plotly==6.8.0",
    "pluggy==1.6.0",
    "psycopg2-binary==2.9.12",
    "py==1.11.0",
    "pycparser==3.0.0",
    "Pygments==2.20.0",
    "pyOpenSSL==24.2.1",
    "pysaml2==7.5.4",
    "PySocks==1.7.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2026.2",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "soupsieve==2.8.4",
    "sqlparse==0.5.5",
    "tenacity==9.1.4",
    "trio==0.33.0",
    "trio-websocket==0.12.2",
    "urllib3==2.7.0",
    "waitress==3.0.2",
    "whitenoise==6.12.0",
    "wsproto==1.3.2",
    "xmlschema==2.5.1",
]

[project.optional-dependencies]
test = [
    "docutils==0.23",
    "pytest==9.1.1",
    "pytest-base-url==2.1.0",
    "pytest-cov==7.1.0",
    "pytest-datadir==1.8.0",
    "pytest-django==4.12.0",
    "pytest-html==4.1.1",
    "pytest-metadata==3.1.1",
    "pytest-variables==3.0.0",
    "ruff~=0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "scutes.settings"
python_files = ['tests.py', 'test_*.py']
pythonpath = ['src', '.']

[tool.coverage.run]
# these were generated by Django
omit = [
    "asgi.py",
    "manage.py",
    "wsgi.py",
    "src/processing/migrations/*"
]

[project.scripts]
"manage.py" = "scutes:django_manage"

[tool.ruff]
extend-exclude = ["src/processing/migrations/*"]
line-length = 120

[tool.ruff.format]
quote-style = "single"  # Use single quotes for strings

[tool.ruff.lint]
# preview is required to enable many pycodestyle rules see
# https://docs.astral.sh/ruff/rules/
preview = true

# Enable pycodestyle errors and warnings
select = ["E", "W"]